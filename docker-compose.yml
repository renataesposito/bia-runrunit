version: "3.8"

services:
  app:
    build:
      context: ./runrun_report
      dockerfile: Dockerfile
    container_name: runrun-report
    ports:
      - "8050:8050"
    env_file:
      - ./runrun_report/.env
    environment:
      - PORT=8050
    volumes:
      - ./runrun_report:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiOWYyNjUzYjdlMWU5NmYwOTExMjhjMWQwMWJjN2E4NTUiLCJ0IjoiYTYwYjE0MmItMmQxZS00ZmNlLTlkNjUtMjE4NTAzYjM5MTU4IiwicyI6Ik56QTVNamM1WTJVdE5ESm1OUzAwTUdJMkxUaGxOVEl0Tm1RM1lUUmlPREkxTmpGaSJ9
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
